server.port=8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.goktugakca.inventory_service.event.OrderCreatedEvent

spring.datasource.url=jdbc:postgresql://localhost:5432/inventorydb
spring.datasource.username=inventory
spring.datasource.password=inventory
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.kafka.order-topic=order.created

